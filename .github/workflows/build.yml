name: build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # release upload on tags
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked
      # MSVC target; .cargo/config.toml statically links the CRT -> standalone exe.
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: CursorDrop
          path: target/release/CursorDrop.exe
      # Tag push (v*) -> GitHub release with the exe; notes are edited by hand after.
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/release/CursorDrop.exe --title "$GITHUB_REF_NAME" --generate-notes
