; CursorDrop config (Android/Termux) — same format as the Windows app.
; List servers as [Server:<name>] sections.
;   Alias     = SSH host alias from your ~/.ssh/config (the host Claude Code runs on)
;   RemoteDir = upload target on the remote. '~' expands to the remote $HOME;
;               an absolute path (starting with '/') is used as-is.
; The first server listed is the default active one. Switch with:
;   cursor-drop.sh pick      (radio dialog)   or   cursor-drop.sh use <name>
; (The legacy [Remote] section is still recognized.)

[Server:prod]
Alias=myserver
RemoteDir=~/.cursor-drop-files

[Server:dev]
Alias=devbox
RemoteDir=~/uploads
